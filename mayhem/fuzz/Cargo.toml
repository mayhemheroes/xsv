# Self-contained cargo-fuzz crate (everything under mayhem/, upstream untouched):
# the [lib] is a shim that #[path]-includes xsv's own source modules (src/cmd, ...)
# so the harness drives the real command code paths in-process; the deps mirror
# upstream Cargo.toml (same version reqs, resolved against the same crates.io).
[package]
name = "xsv-mayhem-fuzz"
version = "0.0.0"
publish = false
edition = "2015"

[package.metadata]
cargo-fuzz = true

[lib]
name = "xsv_shim"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
# xsv's own dependencies (mirrors upstream Cargo.toml)
byteorder = "1"
crossbeam-channel = "0.2.4"
csv = "1"
csv-index = "0.1.5"
docopt = "1"
filetime = "0.1"
num_cpus = "1.4"
rand = "0.5"
regex = "1"
serde = "1"
serde_derive = "1"
streaming-stats = "0.2"
tabwriter = "1"
threadpool = "1.3"

# Prevent this crate from interfering with the upstream package
[workspace]
members = ["."]

# The fuzz binary keeps the legacy Mayhem target name `xsv` so the fork's
# run history isn't orphaned.
[[bin]]
name = "xsv"
path = "fuzz_targets/xsv.rs"
test = false
doc = false
